<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대학생 일정 관리</title>
  <!-- FullCalendar 표준 번들: 공식 문서의 script 태그 방식 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/all/global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/themes/monarch/global.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/skeleton.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/themes/monarch/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.1/themes/monarch/palettes/purple.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6fa; color: #252738; font-family: system-ui, "Malgun Gothic", sans-serif; }
    header { background: white; border-bottom: 1px solid #e5e7ef; padding: 24px max(24px, calc((100vw - 1200px)/2)); }
    h1 { margin: 0; font-size: 24px; }
    header p { margin: 8px 0 0; color: #717589; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; max-width: 1248px; margin: 28px auto; padding: 0 24px; }
    .panel { background: white; border: 1px solid #e5e7ef; border-radius: 16px; padding: 24px; min-width: 0; }
    h2 { margin: 0 0 8px; font-size: 19px; }
    #selected-date { color: #6b4ee6; font-weight: 600; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; }
    input, button { font: inherit; }
    input { width: 100%; border: 1px solid #d7dbea; border-radius: 8px; padding: 10px; }
    input[type="color"] {width: 100%;height: 42px;padding: 4px; cursor: pointer;}
    button[type="submit"] { width: 100%; border: 0; border-radius: 8px; background: #6b4ee6; color: white; padding: 12px; margin-top: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px 0; border-bottom: 1px solid #eee; overflow-wrap: anywhere; }
    .hint { color: #717589; font-size: 13px; line-height: 1.7; }
    #status { color: #a32e40; }
    /* 선택 날짜를 강조하고, 오늘 날짜의 기본 강조는 선택 표시와 구분합니다. */
    #calendar .fc-daygrid-day.selected-day,
    #calendar .fc-timegrid-col.selected-day { background: #eee9ff; }
    #calendar .fc-daygrid-day.selected-day .fc-daygrid-day-number { background: #6b4ee6; color: white; border-radius: 50%; min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
    #calendar .fc-day-today:not(.selected-day) { background: transparent; }
    #calendar .fc-day-today:not(.selected-day) .fc-daygrid-day-number { background: transparent; color: inherit; }
    .auth-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; }
    .auth-nav a { color: #6b4ee6; text-decoration: none; font-weight: 600; }
    .auth-nav button { border: 1px solid #d7dbea; border-radius: 8px; background: white; padding: 7px 12px; cursor: pointer; }
    .auth-nav[hidden], .auth-nav [hidden] { display: none !important; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>대학생 일정 관리</h1>
    <p>수업 · 과제 · 시험 · 팀 프로젝트를 한눈에</p>
    <nav id="auth-nav" class="auth-nav" aria-label="계정" hidden>
      <span id="auth-user"></span>
      <a id="auth-login" href="login.html" hidden>로그인</a>
      <a id="auth-signup" href="signup.html" hidden>회원가입</a>
      <button id="auth-logout" type="button" hidden>로그아웃</button>
    </nav>
  </header>
  <main>
    <section class="panel" aria-label="달력">
      <!-- 달력 담당자가 수정할 구역 -->
      <div id="calendar"></div>
      <p id="status" role="status"></p>
    </section>
    <section class="panel" id="schedule">
  <h2>선택한 날짜의 일정</h2>
  <p id="selected-date" aria-live="polite"></p>

  <ul id="schedule-list"></ul>

<form id="schedule-form">
  <label for="schedule-title">일정 제목</label>
  <input
    type="text"
    id="schedule-title"
    placeholder="일정 제목을 입력하세요"
    required
  >

  <label for="start-time">시작 시간</label>
  <input type="time" id="start-time" required>

  <label for="end-time">종료 시간</label>
  <input type="time" id="end-time" required>

  <label for="schedule-color">일정 색상</label>
  <input type="color" id="schedule-color" value="#6b4ee6">

  <button type="submit" id="submit-button">일정 추가</button>
  <button type="button" id="cancel-edit" hidden>수정 취소</button>

</form>

  <p class="hint">날짜를 클릭해 일정을 확인하세요.</p>
</section>
  </main>
  <script>
    // 인증 표시만 담당합니다. 기존 달력 코드는 수정하지 않습니다.
    (function () {
      const nav = document.getElementById("auth-nav");
      const userLabel = document.getElementById("auth-user");
      const loginLink = document.getElementById("auth-login");
      const signupLink = document.getElementById("auth-signup");
      const logoutButton = document.getElementById("auth-logout");

      function renderAuth(user) {
        userLabel.textContent = user ? `${user.nickname}님` : "";
        loginLink.hidden = Boolean(user);
        signupLink.hidden = Boolean(user);
        logoutButton.hidden = !user;
        nav.hidden = false;
      }

      async function refreshAuth() {
        try {
          const response = await fetch("/api/auth/me", { credentials: "same-origin" });
          if (response.status === 401) {
            renderAuth(null);
            return;
          }
          if (!response.ok) throw new Error("로그인 상태 확인 실패");
          const result = await response.json();
          renderAuth(result.success && result.user ? result.user : null);
        } catch (error) {
          console.error("인증 상태 확인 오류:", error);
          nav.hidden = true;
        }
      }

      logoutButton.addEventListener("click", async function () {
        logoutButton.disabled = true;
        try {
          const response = await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "same-origin"
          });
          if (!response.ok) throw new Error("로그아웃 실패");
          renderAuth(null);
        } catch (error) {
          alert("로그아웃에 실패했습니다. 다시 시도해 주세요.");
        } finally {
          logoutButton.disabled = false;
        }
      });

      refreshAuth();
    })();
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 로컬 날짜: UTC 변환으로 날짜가 바뀌는 것을 방지합니다.
      const today = new Date();
      const todayStr = [today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")].join("-");
      let selectedDate = todayStr;
      let editingEvent = null;
      const list = document.getElementById("schedule-list");

      if (!window.FullCalendar) {
        document.getElementById("status").textContent =
          "달력을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해주세요.";
        return;
      }

      const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
        initialView: "dayGridMonth",
        initialDate: todayStr,
        locale: "ko",
        views : {
          dayGridMonth : {
            displayEventTime: false
          }
        },
        allDayText: "모든 일정",
        height: "auto",
        headerToolbar: {
          left: "prev,next today",
          center: "title",
          right: "dayGridMonth,timeGridWeek"
        },
        buttonText: { today: "오늘", month: "월", week: "주", day: "일" },
        events: [],
        datesSet: function () { highlightSelectedDate(); },
        dateClick: function (info) {
          resetScheduleForm();
          selectedDate = info.dateStr.slice(0, 10);
          renderScheduleList();
          highlightSelectedDate();
        },
        eventClick: function (info) {
          resetScheduleForm();
          selectedDate = info.event.startStr.slice(0, 10);
          renderScheduleList();
        }
      });

      function highlightSelectedDate() {
        document.querySelectorAll("#calendar .selected-day").forEach(function (cell) {
          cell.classList.remove("selected-day");
        });
        document.querySelectorAll("#calendar [data-date]").forEach(function (cell) {
          if (cell.getAttribute("data-date") === selectedDate) {
            cell.classList.add("selected-day");
          }
        });
      }

  function renderScheduleList() {
  document.getElementById("selected-date").textContent = selectedDate;
  list.replaceChildren();

  const events = calendar.getEvents().filter(function (event) {
    return event.startStr.slice(0, 10) === selectedDate;
  });

  if (events.length === 0) {
    const empty = document.createElement("li");
    empty.textContent = "등록된 일정이 없습니다.";
    list.appendChild(empty);
  }

  events.forEach(function (event) {
    const item = document.createElement("li");

    const title = document.createElement("span");
    title.textContent = event.title;

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.textContent = "삭제";
    deleteButton.style.marginLeft = "10px";

    deleteButton.addEventListener("click", function () {
      if (confirm("이 일정을 삭제하시겠습니까?")) {
        if (editingEvent === event) {
            resetScheduleForm();
        }
        event.remove();
        renderScheduleList();
      }
    });
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "수정";
    editButton.style.marginLeft = "10px";

    editButton.addEventListener("click", function () {
    editingEvent = event;

  scheduleTitle.value = event.title;
  startTimeInput.value = event.startStr.slice(11, 16);
  endTimeInput.value = event.endStr.slice(11, 16);
  scheduleColor.value = event.backgroundColor || "#6b4ee6";

  submitButton.textContent = "수정 완료";
  cancelEdit.hidden = false;
});

    item.appendChild(title);
    item.appendChild(editButton);
    item.appendChild(deleteButton);
    list.appendChild(item);
  });
}
const scheduleForm = document.getElementById("schedule-form");
const scheduleTitle = document.getElementById("schedule-title");
const startTimeInput = document.getElementById("start-time");
const endTimeInput = document.getElementById("end-time");
const scheduleColor = document.getElementById("schedule-color");
const submitButton = document.getElementById("submit-button");
const cancelEdit = document.getElementById("cancel-edit");

scheduleForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const title = scheduleTitle.value.trim();
  const startTime = startTimeInput.value;
  const endTime = endTimeInput.value;

  if (!title) {
    alert("일정 제목을 입력하세요.");
    return;
  }

  if (startTime >= endTime) {
    alert("종료 시간은 시작 시간보다 늦어야 합니다.");
    return;
  }

  console.log("선택한 색상:", scheduleColor.value);

  if (editingEvent !== null) {

  // 기존 일정 수정
  const date = editingEvent.startStr.slice(0, 10);

  editingEvent.setProp("title", title);

  editingEvent.setDates(
    date + "T" + startTime,
    date + "T" + endTime,
    { allDay: false }
  );

  editingEvent.setProp("backgroundColor", scheduleColor.value);
  editingEvent.setProp("borderColor", scheduleColor.value);

} else {

  // 새로운 일정 추가
  calendar.addEvent({
    title: title,
    start: selectedDate + "T" + startTime,
    end: selectedDate + "T" + endTime,
    allDay: false,
    color: scheduleColor.value,
    backgroundColor: scheduleColor.value,
    borderColor: scheduleColor.value
  });

}

  resetScheduleForm();
  renderScheduleList();
});

function resetScheduleForm() {
  editingEvent = null;
  scheduleForm.reset();
  submitButton.textContent = "일정 추가";
  cancelEdit.hidden = true;
}

cancelEdit.addEventListener("click", function () {
  resetScheduleForm();
});
      calendar.render();
      renderScheduleList();
      highlightSelectedDate();
    });
  </script>
</body>
</html>
