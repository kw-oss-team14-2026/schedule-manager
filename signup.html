<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 대학생 일정 관리</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="back-link" href="login.html">← 로그인으로 돌아가기</a>
    <h1>회원가입</h1>
    <p class="subtitle">일정 관리를 시작할 계정을 만들어보세요.</p>
    <form id="signup-form" novalidate>
      <label for="nickname">이름 또는 닉네임</label>
      <input id="nickname" name="nickname" type="text" autocomplete="nickname" required maxlength="50" placeholder="표시할 이름">
      <label for="login-id">로그인 아이디</label>
      <input id="login-id" name="login_id" type="text" autocomplete="username" required maxlength="50" placeholder="로그인 아이디 (최대 50자)">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="8자 이상">
      <label for="confirm-password">비밀번호 확인</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="8" placeholder="비밀번호 다시 입력">
      <button type="submit">회원가입</button>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <p class="footer-link">이미 계정이 있나요? <a href="login.html">로그인</a></p>
  </main>
</body>
</html>
