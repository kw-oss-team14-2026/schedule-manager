<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 대학생 일정 관리</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <a class="back-link" href="index.html">← 달력으로 돌아가기</a>
    <h1>로그인</h1>
    <p class="subtitle">과제와 일정을 한곳에서 관리하세요.</p>
    <form id="login-form" novalidate>
      <label for="login-id">로그인 아이디</label>
      <input id="login-id" name="login_id" type="text" autocomplete="username" required maxlength="50" placeholder="로그인 아이디 (최대 50자)">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="비밀번호 입력">
      <button type="submit">로그인</button>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <p class="footer-link">계정이 없나요? <a href="signup.html">회원가입</a></p>
  </main>
</body>
</html>
